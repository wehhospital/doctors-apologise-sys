<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل العمليات واللوجز الشامل</title>
    <!-- 1. مكتبات سوبا بيز وتايلويند والخط -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        th, td { white-space: nowrap !important; padding: 12px 10px !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-2 md:p-4">

    <div class="w-full max-w-[99%] mx-auto space-y-4">
        
        <!-- الشريط العلوي -->
        <div class="bg-white p-4 md:p-5 rounded-xl shadow-md border-t-4 border-gray-800 flex justify-between items-center">
            <div>
                <h1 class="text-2xl md:text-3xl font-black text-gray-800">📜 سجل تحركات النظام الشامل (Live Logs)</h1>
                <p class="text-gray-600 text-xs font-bold mt-1">Made By Abdallah - IT Department</p>
            </div>
            <button onclick="logout()" class="bg-red-100 hover:bg-red-200 text-red-700 text-xs font-bold px-4 py-2 rounded-lg transition">خروج 🚪</button>
        </div>

        <!-- أزرار التنقل بين الصفحات -->
        <div class="flex gap-2 border-b border-gray-300 pb-2">
            <a href="index.html" class="px-5 py-2.5 rounded-lg text-sm font-extrabold bg-white text-gray-700 hover:bg-gray-200 shadow">📋 جدول الاعتذارات</a>
            <a href="users.html" class="px-5 py-2.5 rounded-lg text-sm font-extrabold bg-white text-gray-700 hover:bg-gray-200 shadow">👥 إدارة المستخدمين</a>
            <a href="logs.html" class="px-5 py-2.5 rounded-lg text-sm font-extrabold bg-gray-900 text-white shadow">📜 سجل العمليات (Logs)</a>
        </div>

        <!-- الهيدر والتحكم -->
        <div class="bg-white p-4 rounded-xl shadow-md flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-xl">📊</span>
                <h2 class="text-base font-black text-gray-800">قائمة جميع الأحداث المباشرة (سوبا بيز أونلاين)</h2>
                <span id="logsCountBadge" class="bg-blue-100 text-blue-800 text-xs font-bold px-2.5 py-1 rounded-full">0 أحداث</span>
            </div>
            <div class="flex gap-2">
                <button onclick="loadLogsFromDatabase()" class="bg-gray-800 hover:bg-black text-white px-4 py-2 rounded-lg text-xs font-bold transition">🔄 تحديث يدوياً</button>
                <button onclick="deleteAllLogs()" class="bg-red-100 hover:bg-red-200 text-red-700 px-4 py-2 rounded-lg text-xs font-bold transition">🧹 تفريغ السجل بالكامل</button>
            </div>
        </div>

        <!-- جدول اللوجز -->
        <div class="bg-white rounded-xl shadow-lg overflow-hidden border border-gray-300 w-full">
            <table class="w-full text-center border-collapse">
                <thead>
                    <tr class="bg-gray-200 border-b-2 border-gray-400 text-black text-sm font-black">
                        <th class="p-3.5 border-l border-gray-300">م</th>
                        <th class="p-3.5 border-l border-gray-300">التاريخ والوقت</th>
                        <th class="p-3.5 border-l border-gray-300">المستخدم</th>
                        <th class="p-3.5 border-l border-gray-300">نوع الإجراء</th>
                        <th class="p-3.5">التفاصيل الكاملة</th>
                    </tr>
                </thead>
                <tbody id="logsTableBody" class="divide-y divide-gray-300 text-sm font-bold">
                    <tr>
                        <td colspan="5" class="p-8 text-gray-400">جاري تحميل السجلات أونلاين...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <script>
        // 1. التحقق من أن الحساب الحالي أدمن
        const currentUser = checkAuth('admin');

        // 2. دالة جلب اللوجز أونلاين مباشرة من Supabase بدون أي تعقيدات محليّة
        async function loadLogsFromDatabase() {
            const tbody = document.getElementById('logsTableBody');
            const badge = document.getElementById('logsCountBadge');
            const client = getSupabase();

            if (!client) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-red-600 font-bold">❌ فشل الاتصال بقاعدة البيانات</td></tr>`;
                return;
            }

            const { data, error } = await client
                .from('audit_logs')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                console.error("❌ خطأ جلب اللوجز:", error.message);
                tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-red-600 font-bold">⚠️ خطأ: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-gray-400 font-bold text-base">لا يوجد أي حركات مسجلة حتى الآن</td></tr>`;
                badge.innerText = `0 أحداث`;
                return;
            }

            badge.innerText = `${data.length} حدث مسجل`;
            tbody.innerHTML = '';

            data.forEach((log, index) => {
                const dateFormatted = log.created_at ? new Date(log.created_at).toLocaleString('ar-EG', {
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit', second: '2-digit'
                }) : '-';

                const tr = document.createElement('tr');
                tr.className = index % 2 === 0 ? 'bg-white hover:bg-gray-100 transition' : 'bg-gray-50 hover:bg-gray-100 transition';

                tr.innerHTML = `
                    <td class="p-3 border-l border-gray-300 font-black text-gray-500">${index + 1}</td>
                    <td class="p-3 border-l border-gray-300 text-gray-600 dir-ltr text-xs">${dateFormatted}</td>
                    <td class="p-3 border-l border-gray-300 text-black font-extrabold">${log.user_name || 'مستخدم'}</td>
                    <td class="p-3 border-l border-gray-300 font-black text-red-600 text-xs">${log.action || '-'}</td>
                    <td class="p-3 text-right pr-6 font-semibold text-gray-800">${log.details || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 3. دالة تفريغ اللوجز بالكامل أونلاين
        async function deleteAllLogs() {
            if (confirm('تنبيه للمدير: هل أنت متأكد من مسح جميع اللوجز من قاعدة البيانات أونلاين؟')) {
                const client = getSupabase();
                if (client) {
                    const { error } = await client.from('audit_logs').delete().neq('id', 0);
                    if (error) {
                        alert("⚠️ فشل التفريغ: " + error.message);
                    } else {
                        createLog('مسح السجل', `قام المدير (${currentUser.name}) بتفريغ سجل الحركات بالكامل`);
                        loadLogsFromDatabase();
                    }
                }
            }
        }

        // 4. البث اللحظي المباشر: أي حركة جديدة من أي جهاز تُعرض فوراً بدون ريفرش
        function setupRealtimeLogs() {
            const client = getSupabase();
            if (!client) return;

            client
              .channel('logs-realtime-channel')
              .on('postgres_changes', { event: '*', schema: 'public', table: 'audit_logs' }, () => {
                  loadLogsFromDatabase();
              })
              .subscribe();
        }

        // تشغيل الجلب والتحديث المباشر فور فتح الصفحة
        loadLogsFromDatabase();
        setupRealtimeLogs();
    </script>
</body>
</html>
