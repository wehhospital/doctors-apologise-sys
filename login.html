<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام الاعتذارات</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-100 min-h-screen p-4">

    <div class="flex items-center justify-center min-h-[85vh]">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border-t-4 border-red-600">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-black text-red-600">تسجيل الدخول للنظام</h1>
                <p class="text-xs font-bold text-gray-500 mt-1">جدول اعتذارات الأطباء</p>
            </div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">اسم المستخدم</label>
                    <input type="text" id="username" required placeholder="ادخل اسم المستخدم" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm font-semibold outline-none focus:ring-2 focus:ring-red-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">كلمة المرور</label>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm font-semibold outline-none focus:ring-2 focus:ring-red-500">
                </div>

                <div id="loginError" class="text-red-600 text-xs font-bold hidden text-center">
                    ❌ اسم المستخدم أو كلمة المرور غير صحيحة!
                </div>

                <button type="submit" id="loginBtn" class="w-full bg-red-600 hover:bg-red-700 text-white font-black py-2.5 rounded-lg shadow transition flex items-center justify-center gap-2">
                    <span id="loginBtnText">دخول</span>
                    <span id="loginSpinner" class="hidden animate-spin">⏳</span>
                </button>
            </form>

        </div>
    </div>

    <script>
        const adminFallback = { id: "1", username: "admin", password: "7745", name: "أحمد (المدير)", role: "admin" };

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();

            document.getElementById('loginBtnText').innerText = "جاري التحقق...";
            document.getElementById('loginSpinner').classList.remove('hidden');

            const client = getSupabase();
            let foundUser = null;

            if (client) {
                const { data } = await client
                    .from('profiles')
                    .select('*')
                    .ilike('username', u)
                    .eq('password', p)
                    .maybeSingle();

                if (data) {
                    foundUser = { id: data.id, username: data.username, name: data.name, role: data.role, password: data.password };
                }
            }

            if (!foundUser && u.toLowerCase() === adminFallback.username && p === adminFallback.password) {
                foundUser = adminFallback;
            }

            if (foundUser) {
                localStorage.setItem('currentUser', JSON.stringify(foundUser));
                document.getElementById('loginError').classList.add('hidden');
                
                // 🚨 ننتظر حفظ اللوج في سوبا بيز أونلاين قبل توجيه الصفحة حتى لا يُلغى الطلب!
                await createLog('تسجيل دخول', `قام (${foundUser.name}) بتسجيل الدخول إلى النظام (الصلاحية: ${foundUser.role})`);
                
                window.location.href = 'index.html';
            } else {
                document.getElementById('loginBtnText').innerText = "دخول";
                document.getElementById('loginSpinner').classList.add('hidden');
                document.getElementById('loginError').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
